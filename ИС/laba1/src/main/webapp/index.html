<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Квартиры</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script type="module" src="assets/auth.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#flats"><span class="brand-mark" aria-hidden="true">К</span> Квартиры</a>
    <nav id="app-nav" aria-label="Основное меню" hidden>
      <a href="#flats" data-nav="flats">Квартиры</a>
      <a href="#houses" data-nav="houses">Дома</a>
      <a href="#coordinates" data-nav="coordinates">Координаты</a>
      <a href="#operations" data-nav="operations">Операции</a>
    </nav>
    <div id="user-menu" class="user-menu" hidden><span id="current-user"></span><button type="button" id="logout">Выйти</button></div>
  </header>

  <main id="auth-screen">
    <section class="auth-card" aria-labelledby="auth-title">
      <h1 id="auth-title">Вход</h1>
      <p class="subheading">Войдите, чтобы просматривать квартиры и управлять ими.</p>
      <div class="button-row auth-tabs"><button type="button" class="primary" data-auth-mode="login">Вход</button><button type="button" data-auth-mode="register">Регистрация</button></div>
      <form id="auth-form">
        <label class="field">Логин<input name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" required><span class="hint">От 3 до 32 латинских букв, цифр или символов _</span></label>
        <label class="field">Пароль<input name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><span class="hint">От 8 до 128 символов</span></label>
        <p id="auth-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="primary">Войти</button>
      </form>
    </section>
    <noscript><p class="notice">Для работы приложения включите JavaScript в браузере.</p></noscript>
  </main>

  <main id="app-content" hidden>
    <div id="notice" class="notice" role="status" hidden></div>
    <section id="flats-section" data-section="flats"></section>
    <section id="houses-section" data-section="houses" hidden></section>
    <section id="coordinates-section" data-section="coordinates" hidden></section>
    <section id="operations-section" data-section="operations" hidden></section>
    <noscript><p class="notice">Для работы с таблицами и формами включите JavaScript в браузере.</p></noscript>
  </main>

  <dialog id="flat-editor" class="dialog-wide" aria-labelledby="flat-editor-title">
    <header class="dialog-header"><h2 id="flat-editor-title">Новая квартира</h2><button type="button" class="icon-button" data-close aria-label="Закрыть">×</button></header>
    <form id="flat-form" novalidate>
      <div class="dialog-body">
        <p class="form-error" role="alert" hidden></p>
        <div class="form-grid">
          <label class="field full">Название <input name="name" autocomplete="off" required><span class="field-error" data-error-for="name"></span></label>
          <label class="field">Площадь <input name="area" type="number" min="1" step="1" required><span class="field-error" data-error-for="area"></span></label>
          <label class="field">Цена <input name="price" type="number" min="0" step="any" required><span class="field-error" data-error-for="price"></span></label>
          <label class="field">Число комнат <input name="numberOfRooms" type="number" min="1" max="11" step="1" required><span class="field-error" data-error-for="numberOfRooms"></span></label>
          <label class="field">Пешком до метро <input name="timeToMetroOnFoot" type="number" min="0" step="any" required><span class="field-error" data-error-for="timeToMetroOnFoot"></span></label>
          <label class="field">Вид из окна <select name="view" required><option value="">Выберите вид</option><option value="STREET">Улица — STREET</option><option value="YARD">Двор — YARD</option><option value="PARK">Парк — PARK</option><option value="BAD">Плохой — BAD</option><option value="TERRIBLE">Очень плохой — TERRIBLE</option></select><span class="field-error" data-error-for="view"></span></label>
          <label class="field">Транспорт <select name="transport"><option value="">Не указан</option><option value="FEW">Мало — FEW</option><option value="LITTLE">Немного — LITTLE</option><option value="NORMAL">Нормально — NORMAL</option></select></label>
          <label class="field">Балкон <select name="balcony"><option value="">Не указано</option><option value="true">Есть</option><option value="false">Нет</option></select></label>
          <label class="field">Мебель <select name="furniture"><option value="">Не указано</option><option value="true">Есть</option><option value="false">Нет</option></select></label>
        </div>
        <fieldset class="form-section">
          <legend>Координаты</legend>
          <div class="radio-row"><label><input type="radio" name="coordinateMode" value="new" checked> Новые</label><label><input type="radio" name="coordinateMode" value="existing"> Существующие</label></div>
          <div id="new-coordinates" class="form-grid">
            <label class="field">X <input name="x" type="number" step="any"><span class="field-error" data-error-for="x"></span></label>
            <label class="field">Y <input name="y" type="number" max="249" step="any"><span class="field-error" data-error-for="y"></span><span class="hint">Не больше 249</span></label>
          </div>
          <div id="existing-coordinates" hidden><div class="selection-row"><span id="selected-coordinates">Координаты не выбраны</span><button type="button" id="choose-coordinates">Выбрать</button></div><span class="field-error" data-error-for="coordinatesId"></span></div>
        </fieldset>
        <fieldset class="form-section">
          <legend>Дом <span class="optional">необязательно</span></legend>
          <div class="selection-row"><span id="selected-house">Без дома</span><div class="button-row"><button type="button" id="choose-house">Выбрать</button><button type="button" id="clear-house" hidden>Убрать</button></div></div>
          <span class="field-error" data-error-for="houseId"></span>
        </fieldset>
      </div>
      <footer class="dialog-footer"><button type="button" data-close>Отмена</button><button type="submit" class="primary">Создать квартиру</button></footer>
    </form>
  </dialog>

  <dialog id="flat-detail" class="dialog-wide" aria-labelledby="flat-detail-title">
    <header class="dialog-header"><h2 id="flat-detail-title">Квартира</h2><button type="button" class="icon-button" data-close aria-label="Закрыть">×</button></header>
    <div id="flat-detail-body" class="dialog-body"></div>
    <footer class="dialog-footer"><button type="button" data-close>Закрыть</button><button type="button" id="detail-delete">Удалить</button><button type="button" id="detail-edit" class="primary">Редактировать</button></footer>
  </dialog>

  <dialog id="delete-dialog" class="dialog-small" aria-labelledby="delete-title">
    <header class="dialog-header"><h2 id="delete-title">Удалить квартиру?</h2><button type="button" class="icon-button" data-close aria-label="Закрыть">×</button></header>
    <form id="delete-form"><div class="dialog-body"><p id="delete-description"></p><p class="hint">Это действие нельзя отменить.</p><p class="form-error" role="alert" hidden></p></div><footer class="dialog-footer"><button type="button" data-close>Отмена</button><button type="submit" class="primary">Удалить</button></footer></form>
  </dialog>

  <dialog id="reference-editor" class="dialog-small" aria-labelledby="reference-editor-title">
    <header class="dialog-header"><h2 id="reference-editor-title">Новый объект</h2><button type="button" class="icon-button" data-close aria-label="Закрыть">×</button></header>
    <form id="reference-form" novalidate><div class="dialog-body"><p class="form-error" role="alert" hidden></p><div id="reference-fields" class="form-grid"></div></div><footer class="dialog-footer"><button type="button" data-close>Отмена</button><button type="submit" class="primary">Создать</button></footer></form>
  </dialog>

  <dialog id="reference-picker" class="dialog-wide" aria-labelledby="reference-picker-title">
    <header class="dialog-header"><h2 id="reference-picker-title">Выбрать объект</h2><button type="button" class="icon-button" data-close aria-label="Закрыть">×</button></header>
    <div class="dialog-body"><form id="picker-filter" class="inline-form" novalidate><label class="field grow"><span id="picker-filter-label">Название</span><input name="search" autocomplete="off"></label><button type="submit">Найти</button><button type="button" id="picker-reset">Сбросить</button></form><p id="picker-error" class="form-error" role="alert" hidden></p><div id="picker-table" class="table-scroll picker-table"></div><div id="picker-pagination" class="pagination"></div></div>
    <footer class="dialog-footer"><button type="button" data-close>Отмена</button><button type="button" id="picker-create">Создать новый объект</button></footer>
  </dialog>

  <dialog id="reference-detail" class="dialog-small" aria-labelledby="reference-detail-title"><header class="dialog-header"><h2 id="reference-detail-title">Объект</h2><button type="button" class="icon-button" data-close aria-label="Закрыть">×</button></header><div id="reference-detail-body" class="dialog-body"></div><footer class="dialog-footer"><button type="button" data-close>Закрыть</button></footer></dialog>

  <dialog id="lookup-dialog" class="dialog-small" aria-labelledby="lookup-title"><header class="dialog-header"><h2 id="lookup-title">Найти по ID</h2><button type="button" class="icon-button" data-close aria-label="Закрыть">×</button></header><form id="lookup-form" novalidate><div class="dialog-body"><p class="form-error" role="alert" hidden></p><label class="field">ID <input name="id" type="number" min="1" step="1" required><span class="field-error" data-error-for="id"></span></label></div><footer class="dialog-footer"><button type="button" data-close>Отмена</button><button type="submit" class="primary">Открыть</button></footer></form></dialog>
</body>
</html>
