services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flats}
      POSTGRES_USER: ${POSTGRES_USER:-flats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/init/flat_functions.sql:/docker-entrypoint-initdb.d/02_flat_functions.sql:ro
      - ./db/init/users.sql:/docker-entrypoint-initdb.d/03_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-flats}
      JWT_SECRET: ${JWT_SECRET:-}
      POSTGRES_USER: ${POSTGRES_USER:-flats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
